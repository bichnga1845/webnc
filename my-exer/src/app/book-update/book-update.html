<h2>Update Book</h2>
<a routerLink="/ex39">Return to list</a>
<p style="color: red;">{{errMessage}}</p>

<table>
    <tr>
        <td>Book Id:</td>
        <td>
            <input type="text" class="form-control" #name="ngModel" name="BookId"
            id="BookId" placeholder="Enter Book Id"
            [(ngModel)]="book.BookId" readonly/>
        </td>
    </tr>
    <tr>
        <td>Book Name:</td>
        <td>
            <input type="text" class="form-control" #name="ngModel"
            name="BookName" id="BookName" placeholder="Enter Book Name"
            [(ngModel)]="book.BookName"/>
        </td>
    </tr>
    <tr>
        <td>Price:</td>
        <td>
            <input type="text" class="form-control" #name="ngModel"
            name="BookPrice" id="BookPrice" placeholder="Enter Price"
            [(ngModel)]="book.Price"/>
        </td>
    </tr>
    <tr>
        <td colspan="2">
            <button (click)="putBook()">Update</button>
        </td>
    </tr>

</table>

<table border="1">
    <tr>
        <td>BookId</td>
        <td>BookName</td>
        <td>Price</td>
        <td>Image</td>
    </tr>
    <tbody>
        <tr *ngFor="let book of books">
            <td>{{book.BookId}}</td>
            <td>{{book.BookName}}</td>
            <td>{{book.Price}} </td>
            <td>
                <img src="https://localhost:3000/images/{{book.Image}}" width="50px"
                height="50px">
            </td>
        </tr>
    </tbody>
</table>
