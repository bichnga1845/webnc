Book Id: <input type="text" #bookId> <button

<table>
    <tr>
        <td>Book Id:</td>
        <td>{{book?.BookId}}</td>
    </tr>

    <tr>
        <td>Book Name:</td>
        <td>{{book?.BookName}}</td>
    </tr>

    <tr>
        <td>Price:</td>
        <td>{{book?.Price}} </td>
    </tr>

    <tr>
        <td colspan="2">
            <img [src]="getImageUrl(book?.Image)" 
                 height="100" width="100">
        </td>
    </tr>
</table>
