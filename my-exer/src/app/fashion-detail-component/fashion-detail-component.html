<div style="background-color: yellow; padding: 20px; margin: 20px;">
<h2 style="color: red; font-size: 30px;">FASHION DETAIL WORKS!</h2>
<p style="color: red;">{{errMessage}}</p>

<div *ngIf="!fashion && !errMessage" style="font-size: 20px; color: blue;">Loading...</div>

<table border="1" *ngIf="fashion">
  <tr>
    <td><strong>Fashion Id:</strong></td>
    <td>{{fashion?._id}}</td>
  </tr>
  <tr>
    <td><strong>Fashion Subject:</strong></td>
    <td>{{fashion?.fashion_subject}}</td>
  </tr>
  <tr>
    <td><strong>Fashion Detail:</strong></td>
    <td>{{fashion?.fashion_detail}}</td>
  </tr>
  <tr>
    <td><strong>Fashion Image:</strong></td>
    <td>
      <img *ngIf="fashion?.fashion_image" src="{{parse_image(fashion.fashion_image)}}" width="300px" height="300px">
    </td>
  </tr>
</table>

<br>
<a routerLink="/ex53">
  <button>Back to List</button>
</a>
</div>
