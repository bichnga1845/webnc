<div class="product-list-container">
  <div class="header">
    <h1>Danh sách sản phẩm</h1>
    <button class="cart-btn" (click)="viewCart()">
      🛒 Giỏ hàng <span class="cart-badge" *ngIf="cartCount > 0">{{cartCount}}</span>
    </button>
  </div>

  <div *ngIf="loading" class="loading">
    <p>Đang tải sản phẩm...</p>
  </div>

  <div class="products-grid" *ngIf="!loading">
    <div class="product-card" *ngFor="let product of products">
      <div class="product-image">
        <img [src]="product.image" [alt]="product.name" />
      </div>
      <div class="product-info">
        <h3 class="product-name">{{product.name}}</h3>
        <p class="product-category">{{product.category}}</p>
        <p class="product-description">{{product.description}}</p>
        <div class="product-footer">
          <span class="product-price">{{formatPrice(product.price)}}</span>
          <button class="btn-add-cart" (click)="addToCart(product._id)">
            ADD TO CART
          </button>
        </div>
        <div class="product-stock">
          <small>Còn lại: {{product.stock}} sản phẩm</small>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && products.length === 0" class="empty">
    <p>Không có sản phẩm nào.</p>
  </div>
</div>
