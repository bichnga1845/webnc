<p>fashion works!</p>
{{errMessage}}
<table border="1">
    <tr>
    <td>Id</td>
        <td>Fashion Subject</td>
        <td>Fashion Detail</td>
        <td>Image</td>
        <td>Action</td>
    </tr>
    <tbody>
        <tr *ngFor="let fashion of fashions">
            <td>{{fashion._id}}</td>
            <td>{{fashion.fashion_subject}}</td>
            <td>{{fashion.fashion_detail}} </td>
            <td>
                <img src="{{parse_image(fashion.fashion_image)}}" width="100px" height="100px">
            </td>
            <td>
                <a routerLink="/fashion-detail/{{fashion._id}}">
                    <button>Detail</button>
                </a>
            </td>
        </tr>
    </tbody>
</table>
