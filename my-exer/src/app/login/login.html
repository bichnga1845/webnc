<div class="login-container">
  <div class="login-box">
    <h2>Fashion Management System</h2>
    <h3>Login</h3>
    
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Username:</label>
        <input 
          type="text" 
          [(ngModel)]="username" 
          name="username"
          placeholder="Enter username"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-group">
        <label>Password:</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password"
          placeholder="Enter password"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="button-group">
        <button 
          type="submit" 
          class="btn-login"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Loading...' : 'Login' }}
        </button>
        
        <button 
          type="button" 
          class="btn-register"
          (click)="goToRegister()"
          [disabled]="isLoading"
        >
          Create Account
        </button>
      </div>
    </form>
  </div>
</div>
